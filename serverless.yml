org: junah
service: atcoder-readme-stats
frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.14
  region: ap-northeast-2
  logRetentionInDays: 7
  architecture: arm64
  memorySize: 256
  timeout: 10
  versionFunctions: false
  stage: prod
  deploymentBucket:
    name: serverless-framework-deployments-ap-northeast-2-23b5bbd0-81f6
  httpApi:
    name: Atcoder-Readme-Stats-API
    cors: true

functions:
  generate_badge_v1:
    handler: lambdas/v1/generate_badge.handler
    name: generate_badge_v1
    description: Generate badge for Atcoder user (v1)
    events:
      - httpApi:
          path: /v1/generate_badge
          method: get

  generate_badge_v2:
    handler: lambdas/v2/generate_badge.handler
    name: generate_badge_v2
    description: Generate badge for Atcoder user (v2)
    events:
      - httpApi:
          path: /v2/generate_badge
          method: get

  generate_badge_v3:
    handler: lambdas/v3/generate_badge.handler
    name: generate_badge_v3
    description: Generate badge for Atcoder user (v3)
    events:
      - httpApi:
          path: /v3/generate_badge
          method: get

  generate_badge_v4:
    handler: lambdas/v4/generate_badge.handler
    name: generate_badge_v4
    description: Generate badge for Atcoder user (v4)
    events:
      - httpApi:
          path: /v4/generate_badge
          method: get

package:
  # ship only the runtime code; dependencies are added by the built-in Python requirements support
  patterns:
    - "!**"
    - "lambdas/**"
    - "shared/**"
    - "!**/__pycache__/**"
    # v2 embeds these fonts as base64 in fonts.py, so the .ttf files are not needed at runtime
    - "!lambdas/v2/generate_badge/fonts/**"

resources:
  Resources:
    ApiGatewayCustomDomain:
      Type: AWS::ApiGateway::DomainName
      Properties:
        DomainName: atcoder.junah.dev
        RegionalCertificateArn: arn:aws:acm:ap-northeast-2:154601375809:certificate/65c00a29-88b6-4667-9c4e-e66ab266d995
        EndpointConfiguration:
          Types:
            - REGIONAL
        SecurityPolicy: TLS_1_2

    HttpApiCustomDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      DependsOn: HttpApiStage
      Properties:
        DomainName:
          Ref: ApiGatewayCustomDomain
        ApiId:
          Ref: HttpApi
        Stage: $default

    GitHubOIDCProvider:
      Type: AWS::IAM::OIDCProvider
      Properties:
        Url: "https://token.actions.githubusercontent.com"
        ClientIdList:
          - "sts.amazonaws.com"
        ThumbprintList:
          - "6938fd4d98bab03faadb97b34396831e3780aea1"
          - "1c58a3a8518e8759bf075b76b750d4f2df264fcd"

    GithubActionsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: GithubActionsRole
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sts:AssumeRoleWithWebIdentity
              Principal:
                Federated:
                  - Fn::GetAtt: [GitHubOIDCProvider, Arn]
              Condition:
                StringEquals:
                  token.actions.githubusercontent.com:sub: "repo:junah201/atcoder-readme-stats:environment:Production"
        Policies:
          - PolicyName: GithubActionsPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                    - s3:PutObject
                    - s3:GetObject
                  Resource:
                    - "arn:aws:s3:::serverless-framework-deployments-ap-northeast-2-23b5bbd0-81f6"
                    - "arn:aws:s3:::serverless-framework-deployments-ap-northeast-2-23b5bbd0-81f6/*"
                - Effect: Allow
                  Action:
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:GetFunction
                    - lambda:ListVersionsByFunction
                    - lambda:PublishVersion
                  # only this service's badge functions
                  Resource:
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:generate_badge_*"

custom:
  # built into Serverless v4; this block must stay (even empty) to enable it
  pythonRequirements:
    useUv: true
    installer: uv
    slim: true
    # install Linux arm64 wheels for the runtime, whatever machine runs the deploy
    pipCmdExtraArgs:
      - "--python-platform=aarch64-manylinux_2_28"
      - "--python-version=3.14"
      - "--only-binary=:all:"
