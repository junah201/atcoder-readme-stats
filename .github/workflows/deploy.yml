name: Deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "lambdas/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - "serverless.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # keep in sync with .devcontainer/Dockerfile
  SERVERLESS_VERSION: "4.46.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Serverless v4 downloads the framework (~120 MB) on first run; the npm package itself is tiny
      - name: Cache Serverless Framework
        uses: actions/cache@v4
        with:
          path: ~/.serverless/releases
          key: serverless-${{ runner.os }}-${{ env.SERVERLESS_VERSION }}

      - name: Install Serverless Framework
        run: npm install -g serverless@${{ env.SERVERLESS_VERSION }}

      - name: Get AWS Access Token via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy Lambda Functions
        run: |
          sls deploy function -f generate_badge_v1
          sls deploy function -f generate_badge_v2
          sls deploy function -f generate_badge_v3
          sls deploy function -f generate_badge_v4
        env:
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
